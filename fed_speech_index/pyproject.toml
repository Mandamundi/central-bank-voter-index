[project]
name = "fed-speech-index"
version = "0.1.0"
description = "Daily hawkish/dovish index of FOMC voters from their speeches, scored with OpenAI gpt-6-luna"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "pypdf[crypto]>=4.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "matplotlib>=3.7",
    "curl-cffi>=0.7",
    "trafilatura>=2.0",
    "lxml>=5.3",
    "numpy>=2.0",
]

[tool.uv]
package = false
