name: daily-update

on:
  schedule:
    - cron: "0 7 * * *"      # 07:00 UTC daily
    - cron: "0 5 1 * *"      # 05:00 UTC on the 1st: also harvest FRASER (it adds the previous year each January)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Pull new speeches and FOMC voters
        run: uv run update.py

      - name: Harvest FRASER archive (monthly)
        if: github.event.schedule == '0 5 1 * *' || github.event_name == 'workflow_dispatch'
        run: uv run fraser.py

      - name: Score new speeches
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run score.py

      - name: Rebuild indexes
        run: uv run build_index.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data output
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%Y-%m-%d)"
          git push
